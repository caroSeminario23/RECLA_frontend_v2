name: recla
description: "App gamificada pro reciclaje"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  provider: ^6.0.5
  intl: ^0.20.2
  image_picker: ^1.0.4
  youtube_player_flutter: ^9.1.3
  url_launcher: ^6.2.0
  flutter_inappwebview: ^6.0.0
  webview_flutter: ^4.4.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/contadores/
    - assets/images/iconos/
    - assets/images/medallas/
    - assets/images/navbar/
    - assets/fonts/

  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
        - asset: assets/fonts/Silkscreen-Bold.ttf

  generate: true